# IMP-02 — UAT trusted edge NUMERIC POLICY (DEC-010 Layer L1).
#
# EVERY numeric threshold in this file is:
#   PROVISIONAL — UAT ONLY — NOT APPROVED FOR PRODUCTION
#
# These values are NOT derived from measurement. Production approval requires the M1-M8
# capacity-calibration evidence pack, explicit signed risk-policy terms (U, N), the A1-A10
# abuse-test matrix passed at production shape, independent acceptance, a DECISION_LOG.md entry
# of record, and OPS-05 maker-checker sign-off — see docs/03_implementation/IMP-02/README.md.
# Loading this file WITHOUT ../haproxy.base.cfg is not a supported configuration (the frontend
# these tables serve is declared only in the base file).
#
# This file must NEVER be copied into platform/edge/production/ as-is, and no mechanism in this
# repository defaults production configuration to these values (platform/edge/production/
# contains no .cfg file at all — see its README.md).
#
# Note: HAProxy's config parser does not support backslash line-continuation for multi-clause
# directives (verified empirically during IMP-02 Phase 0 — a trailing "\" is read as a literal
# stray token, not a continuation marker) — every directive below is intentionally one physical
# line, however long.

# ---------------------------------------------------------------------------------------------
# Stick tables — one per tracked class. All bounded (explicit size) and evicting (explicit
# expire); type ipv6 so IPv4 sources are stored as IPv4-mapped IPv6 (verified: a /24 mask on an
# IPv4 source correctly zeroes only the last octet, e.g. 127.0.0.1 -> ::ffff:127.0.0.0 — proven
# live against a real HAProxy 3.0.27 binary during IMP-02 Phase 0, not assumed from
# documentation).
# ---------------------------------------------------------------------------------------------

backend b_conn
    # PROVISIONAL — UAT ONLY — NOT APPROVED FOR PRODUCTION
    # Concurrent-connection ceiling per source bucket (governed UAT value: 50). Enforced in
    # ../haproxy.base.cfg's frontend (tcp-request connection, TCP-layer, before HTTP begins) —
    # this backend exists only to hold the table; EDGE_CONN_LIMIT_PER_BUCKET carries the number.
    stick-table type ipv6 size 200k expire 30s store conn_cur

backend b_total_60s
    # PROVISIONAL — UAT ONLY — NOT APPROVED FOR PRODUCTION
    # TOTAL sustained: 120 requests / 60 seconds per source bucket (/32 or /64).
    stick-table type ipv6 size 200k expire 65s store http_req_rate(60s)

backend b_total_1s
    # PROVISIONAL — UAT ONLY — NOT APPROVED FOR PRODUCTION
    # TOTAL short burst: 20 requests / 1 second per source bucket (/32 or /64).
    stick-table type ipv6 size 200k expire 2s store http_req_rate(1s)

backend b_read_60s
    # PROVISIONAL — UAT ONLY — NOT APPROVED FOR PRODUCTION
    # READ class (GET on the two public read paths): 100 requests / 60 seconds.
    stick-table type ipv6 size 200k expire 65s store http_req_rate(60s)

backend b_mutate_60s
    # PROVISIONAL — UAT ONLY — NOT APPROVED FOR PRODUCTION
    # MUTATE class (POST on the four public mutate paths): 10 requests / 60 seconds.
    stick-table type ipv6 size 200k expire 65s store http_req_rate(60s)

backend b_agg_60s
    # PROVISIONAL — UAT ONLY — NOT APPROVED FOR PRODUCTION
    # Aggregate (/24 or /48) sustained ceiling: 8x the TOTAL primary limit = 960 / 60 seconds.
    # Contains small-block source rotation without punishing a single shared egress outright.
    stick-table type ipv6 size 50k expire 65s store http_req_rate(60s)

backend b_agg_1s
    # PROVISIONAL — UAT ONLY — NOT APPROVED FOR PRODUCTION
    # Aggregate (/24 or /48) burst ceiling: 8x the TOTAL primary burst = 160 / 1 second.
    stick-table type ipv6 size 50k expire 2s store http_req_rate(1s)

# ---------------------------------------------------------------------------------------------
# b_gate — final forwarding backend. Performs the actual threshold ENFORCEMENT (the literal
# governed numbers) against the stream-scoped counters tracked by ../haproxy.base.cfg's frontend
# (track-sc1..sc6) — verified live that a counter tracked in one file's frontend is correctly
# readable from another file's backend after use_backend routes the stream there (IMP-02 Phase 0
# capability record). All comparisons use "gt", never "ge": empirically, "ge <N>" under-admits
# by one (proven live with a deterministic staggered-connection test during Phase 0) — "gt <N>"
# is the verified formula to admit exactly N before rejecting.
# ---------------------------------------------------------------------------------------------
backend b_gate
    # PROVISIONAL — UAT ONLY — NOT APPROVED FOR PRODUCTION
    # "Request timeout" (time waiting for the WLT-01 upstream response) — backend-facing, so it
    # is a literal value here rather than an env var (see haproxy.base.cfg's env-guard comment
    # for why client-facing timeouts are parameterized differently).
    timeout connect 5s
    timeout server 10s

    # PROVISIONAL — UAT ONLY — NOT APPROVED FOR PRODUCTION — governed UAT numeric policy:
    http-request deny status 429 content-type "application/json" hdr Retry-After 60 lf-string "{\"success\":false,\"error\":{\"code\":\"RATE_LIMITED\",\"message\":\"rate limit exceeded\"}}" if { sc_http_req_rate(1) gt 120 }
    http-request deny status 429 content-type "application/json" hdr Retry-After 1  lf-string "{\"success\":false,\"error\":{\"code\":\"RATE_LIMITED\",\"message\":\"rate limit exceeded\"}}" if { sc_http_req_rate(2) gt 20 }
    http-request deny status 429 content-type "application/json" hdr Retry-After 60 lf-string "{\"success\":false,\"error\":{\"code\":\"RATE_LIMITED\",\"message\":\"rate limit exceeded\"}}" if { sc_http_req_rate(3) gt 100 }
    http-request deny status 429 content-type "application/json" hdr Retry-After 60 lf-string "{\"success\":false,\"error\":{\"code\":\"RATE_LIMITED\",\"message\":\"rate limit exceeded\"}}" if { sc_http_req_rate(4) gt 10 }
    http-request deny status 429 content-type "application/json" hdr Retry-After 60 lf-string "{\"success\":false,\"error\":{\"code\":\"RATE_LIMITED\",\"message\":\"rate limit exceeded\"}}" if { sc_http_req_rate(5) gt 960 }
    http-request deny status 429 content-type "application/json" hdr Retry-After 1  lf-string "{\"success\":false,\"error\":{\"code\":\"RATE_LIMITED\",\"message\":\"rate limit exceeded\"}}" if { sc_http_req_rate(6) gt 160 }

.if !defined(EDGE_WLT1_UPSTREAM_ADDR)
    .alert "EDGE_WLT1_UPSTREAM_ADDR is required (deployment-specific — not a numeric policy value; e.g. 127.0.0.1:8090 for local UAT)"
.endif
    server s1 "${EDGE_WLT1_UPSTREAM_ADDR}"
