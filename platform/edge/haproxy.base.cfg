# IMP-02 — UAT trusted edge (DEC-010 Layer L1). Reference implementation: HAProxy 3.0.27.
#
# STRUCTURE ONLY. This file contains no governed numeric pre-auth threshold, no body/timeout
# value, and no production number of any kind — every one of those is required but supplied
# externally (an environment variable documented in platform/edge/uat/.env.example, or a literal
# value in platform/edge/uat/haproxy.limits.cfg). Loading this file alone is deliberately
# non-functional (stick-table references below resolve only once a limits file is also loaded).
#
# Governance authority: docs/03_implementation/IMP-02/README.md (ownership, scope) and
# docs/DECISION_LOG.md DEC-010 (architecture). Do not duplicate that governance history here —
# this file is implementation only.
#
# Load with:  haproxy -c -f haproxy.base.cfg -f uat/haproxy.limits.cfg
# Base alone (haproxy -c -f haproxy.base.cfg) MUST fail to validate — this is a deliberate,
# tested property (platform/tests/unit/imp02-edge-config.test.ts), not an oversight.

global
    # Number of stick-table counters ("track-sc*") usable per stream. Stock default is 3; this
    # UAT reference tracks 7 (sc0 connection-concurrency + sc1..sc6 request-rate classes).
    # Verified as a normal runtime directive on stock HAProxy 3.0.27 — no custom build required.
    tune.stick-counters 8

defaults
    mode http
    option http-buffer-request
    # Backend-side (server-facing) timeouts belong to backend sections, which are declared
    # entirely within uat/haproxy.limits.cfg (see b_gate there) — not here.
    timeout connect 5s
    timeout server 10s

# ---------------------------------------------------------------------------------------------
# Required-but-unapproved values — REQUIRED BUT UNAPPROVED (DEC-010 / IMP-02).
#
# No production numeric value for any of these is approved. Startup fails closed if any is
# absent — matching WLT-01's own L3 fail-closed-on-enabled-without-token convention
# (services/wlt1/src/config.ts). The four categories named by IMP-02 are body ceiling, header
# timeout, idle timeout, and request timeout:
#   - EDGE_BODY_LIMIT_BYTES, EDGE_HEADER_TIMEOUT, EDGE_IDLE_TIMEOUT, and the connection-ceiling
#     EDGE_CONN_LIMIT_PER_BUCKET are client-facing and MUST live in this single frontend section
#     (HAProxy frontends cannot be split across -f files — verified empirically; see IMP-02 Phase
#     0 capability record), so they are the ONLY numbers referenced here, and only via variable —
#     never as a literal in this file. Their provisional values live in
#     platform/edge/uat/.env.example, labelled PROVISIONAL — UAT ONLY — NOT APPROVED FOR
#     PRODUCTION.
#   - "Request timeout" (time waiting for the upstream/WLT-01 response) is backend-facing and is
#     therefore a literal, labelled, provisional value directly in uat/haproxy.limits.cfg's
#     backend b_gate — not an env var here.
#   - The pre-authentication rate/connection thresholds themselves (TOTAL/READ/MUTATE/aggregate)
#     are NOT referenced by variable here at all — this frontend only NAMES the stick-tables that
#     carry them (numberless), and the literal governed numbers live entirely in
#     uat/haproxy.limits.cfg's backend b_gate, per IMP-02 (versioned config, never a deploy-time
#     override).
.if !defined(WLT1_PUBLIC_PERIMETER_TOKEN)
    .alert "WLT1_PUBLIC_PERIMETER_TOKEN is required (trusted-edge perimeter-provenance credential)"
.endif
.if !defined(EDGE_BODY_LIMIT_BYTES)
    .alert "EDGE_BODY_LIMIT_BYTES is required (REQUIRED BUT UNAPPROVED — see platform/edge/uat/.env.example)"
.endif
.if !defined(EDGE_HEADER_TIMEOUT)
    .alert "EDGE_HEADER_TIMEOUT is required (REQUIRED BUT UNAPPROVED — see platform/edge/uat/.env.example)"
.endif
.if !defined(EDGE_IDLE_TIMEOUT)
    .alert "EDGE_IDLE_TIMEOUT is required (REQUIRED BUT UNAPPROVED — see platform/edge/uat/.env.example)"
.endif
.if !defined(EDGE_CONN_LIMIT_PER_BUCKET)
    .alert "EDGE_CONN_LIMIT_PER_BUCKET is required (governed UAT value — see platform/edge/uat/.env.example)"
.endif
.if !defined(EDGE_BIND_ADDR)
    .alert "EDGE_BIND_ADDR is required (deployment-specific — not a numeric policy value)"
.endif
.if !defined(EDGE_BIND_PORT)
    .alert "EDGE_BIND_PORT is required (deployment-specific — not a numeric policy value)"
.endif
# ---------------------------------------------------------------------------------------------
# TLS (IMP-02 Turn C, UAT-only). EDGE_TLS_ENABLED is a PRESENCE flag, never a boolean — HAProxy's
# preprocessor tests whether a variable is *defined*, not its value's truthiness. Empirically
# verified during Turn C Phase 0: EDGE_TLS_ENABLED=false still selects this TLS branch and still
# requires EDGE_TLS_CRT_PATH, identically to EDGE_TLS_ENABLED=1. To disable TLS, UNSET the
# variable entirely — never set it to a falsy-looking string.
# ---------------------------------------------------------------------------------------------
.if defined(EDGE_TLS_ENABLED)
.if !defined(EDGE_TLS_CRT_PATH)
    .alert "EDGE_TLS_CRT_PATH is required when EDGE_TLS_ENABLED is defined (fail-closed — EDGE_TLS_ENABLED is a PRESENCE flag: unset it entirely to disable TLS, setting it to any value including \"false\" still enables this branch)"
.endif
.endif

frontend fe_public
.if defined(EDGE_TLS_ENABLED)
    bind "${EDGE_BIND_ADDR}:${EDGE_BIND_PORT}" ssl crt "${EDGE_TLS_CRT_PATH}" ssl-min-ver TLSv1.2
.else
    bind "${EDGE_BIND_ADDR}:${EDGE_BIND_PORT}"
.endif

    timeout http-request "$EDGE_HEADER_TIMEOUT"
    timeout client "$EDGE_IDLE_TIMEOUT"

    # ---- Method / path classification -----------------------------------------------------
    # Exactly six public WLT-01 routes. Case-sensitive, trailing-slash-intolerant (no "-i" flag,
    # no path_beg for admission) — matches Fastify's own defaults (caseSensitive, not
    # ignoreTrailingSlash-relaxed) in services/wlt1/src/server.ts. destination_id is a single
    # path segment, 1-64 characters (services/wlt1/src/routes/public/destinations.ts:33's
    # Type.String({minLength:1,maxLength:64}) contract) — NOT assumed to be a UUID.
    acl m_get  method GET
    acl m_post method POST

    acl p_read_list  path /wlt1/destinations
    acl p_reg_wallet path /wlt1/wallet-destinations
    acl p_reg_payout path /wlt1/payout-destinations
    acl p_read_item  path_reg ^/wlt1/destinations/[^/]{1,64}$
    acl p_poc_chal   path_reg ^/wlt1/wallet-destinations/[^/]{1,64}/proof-of-control/challenges$
    acl p_poc_verify path_reg ^/wlt1/wallet-destinations/[^/]{1,64}/proof-of-control/verify$

    # The public edge never proxies internal routes, including health/readiness.
    acl p_internal path_beg /internal/

    # Path-confusion detectors. The raw, undecoded "path" fetch is used throughout this file —
    # normalize-uri is deliberately never invoked, so these patterns see exactly what the client
    # sent (no silent normalization of a forbidden shape into an allowed one).
    acl has_dslash    path_reg //
    acl has_dotdot    path_reg \.\.
    acl has_enc_slash path_reg %2[fF]

    # ---- TCP-layer connection ceiling (must live here — evaluated before HTTP even begins) --
    tcp-request connection track-sc0 src,ipmask(32,64) table b_conn
    tcp-request connection reject if { sc_conn_cur(0) gt "$EDGE_CONN_LIMIT_PER_BUCKET" }

    # ---- Early, unconditional: strip every inbound client-supplied provenance/forwarding ----
    # header, before any routing decision and before the trusted token is injected. Wildcard
    # prefix strip (not an enumerated list) so a future x-aix-* header is covered automatically.
    http-request del-header x-aix- -m beg
    http-request del-header X-Forwarded-For
    http-request del-header X-Forwarded-Proto
    http-request del-header X-Forwarded-Host
    http-request del-header X-Real-IP
    http-request del-header Forwarded

    # Inject the edge's own trusted perimeter-provenance credential. Never the internal-service
    # token — that credential belongs solely to WLT-01's existing internal-route authentication
    # and must never be confused with, or satisfied by, this one.
    http-request set-header x-aix-perimeter-token "$WLT1_PUBLIC_PERIMETER_TOKEN"

    # ---- Deny internal paths and path-confusion attempts before any further processing ------
    http-request deny deny_status 404 if p_internal
    http-request deny deny_status 404 if has_dslash || has_dotdot || has_enc_slash

    # ---- Body ceiling (REQUIRED BUT UNAPPROVED numeric value — env-guarded, see above) ------
    http-request deny deny_status 413 if { req.body_size gt "$EDGE_BODY_LIMIT_BYTES" }

    # ---- Admission: exactly the six governed method/path pairs, nothing else ----------------
    # MUST precede request-rate tracking below (E1 remediation). Any request that is not
    # internal, not a path-confusion attempt, and not one of the six governed pairs — an unknown
    # path, a wrong method on a known path, etc. — is denied HERE, before it can reach any
    # track-sc* directive. Only requests that are genuinely admitted to the backend ever consume
    # a governed request-rate counter (TOTAL/READ/MUTATE/aggregate); non-admitted traffic still
    # receives its edge-local 404 but can never poison a shared counter (independently proven:
    # a 404 flood, including one deliberately aimed at inflating a /24 or /48 aggregate bucket,
    # produces zero counter movement — see the static and live regression coverage for this
    # property). The TCP-layer connection ceiling (tcp-request connection above) is unaffected —
    # it is a distinct, pre-HTTP concurrency control and remains intentionally unconditional.
    http-request deny deny_status 404 unless m_get p_read_list or m_get p_read_item or m_post p_reg_wallet or m_post p_reg_payout or m_post p_poc_chal or m_post p_poc_verify

    # ---- Request-rate tracking (numberless — table identity only; thresholds enforced in ----
    # ---- uat/haproxy.limits.cfg's backend b_gate, which reads these same stream-scoped ------
    # ---- counters after use_backend routes the request there). Reached ONLY by requests that --
    # ---- survived every deny rule above, i.e. only the six governed method/path pairs. --------
    http-request track-sc1 src,ipmask(32,64) table b_total_60s
    http-request track-sc2 src,ipmask(32,64) table b_total_1s
    http-request track-sc3 src,ipmask(32,64) table b_read_60s   if m_get
    http-request track-sc4 src,ipmask(32,64) table b_mutate_60s if m_post
    http-request track-sc5 src,ipmask(24,48) table b_agg_60s
    http-request track-sc6 src,ipmask(24,48) table b_agg_1s

    # ---- Response security headers -----------------------------------------------------------
    # Minimal set appropriate to a JSON API perimeter — no browser-facing headers invented that
    # this platform has no evidence it needs (no CSP/HSTS/X-Frame-Options: this edge serves no
    # HTML and TLS termination is out of scope for this UAT reference).
    http-response set-header Cache-Control "no-store"
    http-response set-header X-Content-Type-Options "nosniff"
    # No Access-Control-Allow-Origin is set anywhere in this file. There is no approved
    # first-party browser origin (docs/01_masters/09_Master_Security_Architecture_v1.2.md);
    # absence of ACAO is the correct posture, not a wildcard.

    use_backend b_gate
